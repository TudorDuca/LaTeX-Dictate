[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ldbench"
version = "0.1.0"
description = "Benchmark harness for spoken mathematics to LaTeX (LaTeX-Dictate)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.30",
    "numpy>=1.26",
    "pyarrow>=15",
    "rapidfuzz>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Apple Silicon inference backends.
mac = [
    "mlx>=0.30",
    "mlx-lm>=0.32",
    "mlx-whisper>=0.4.3",
    "mlx-audio>=0.6",
]
# Fallback dataset access when the parquet fast path is unavailable.
stream = ["datasets>=3.0"]
# Recording your own test formulas.
record = ["sounddevice>=0.5"]
# Push-to-talk dictation (global hotkey, paste).
dictate = ["sounddevice>=0.5", "pynput>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
ldb = "ldbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ldbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
