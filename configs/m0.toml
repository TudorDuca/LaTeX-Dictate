# M0 feasibility run (docs/PROJECT_PLAN.md §6).
# ~60 dataset clips + your own recordings through three systems:
#   paper reproduction, an open cascade (Whisper -> small LLM), and an open end-to-end audio LLM.
# Model commits are pinned in m0.lock.json by `ldb doctor`.

run_name = "m0"
seed = 0
data_dir = "data"
runs_dir = "runs"

[dataset]
repo = "marsianin500/Speech2Latex"   # CC BY 4.0
language = "eng"
max_per_row_group = 4                # spread the sample across many parquet row groups

[[splits]]
name = "equations"
source = "hf"
hf_split = "equations_test"
task = "equations"
quota = { human = 40, tts = 10 }

[[splits]]
name = "sentences"
source = "hf"
hf_split = "sentences_test"
task = "sentences"
quota = { human = 10 }

[[splits]]
name = "own"
source = "local"
path = "data/own"                    # record with `ldb record`
task = "equations"

# ---------------------------------------------------------------- models

[models.whisper-turbo]
kind = "mlx-whisper"
repo = "mlx-community/whisper-large-v3-turbo"

[models.qwen3-4b]
kind = "mlx-lm"
repo = "mlx-community/Qwen3-4B-Instruct-2507-4bit"

# The paper's released ASR post-correction models (Korzh et al., ICLR 2026).
[models.paper-eq]
kind = "mlx-lm"
repo = "marsianin500/Qwen2.5-math-1.5B-instruct-equations_multilingual_mix"

[models.paper-sent]
kind = "mlx-lm"
repo = "marsianin500/Qwen2.5-math-1.5B-instruct-sentences_eng_mix"

[models.qwen2-audio]
kind = "mlx-audio-chat"
repo = "mlx-community/Qwen2-Audio-7B-Instruct-4bit"

# ---------------------------------------------------------------- systems
# Order matters for `ldb all`: whisper-raw runs first and caches the transcripts reused below.

[[systems]]
name = "whisper-raw"                 # floor: plain dictation, no LaTeX conversion
asr = "whisper-turbo"

[[systems]]
name = "paper@dataset-asr"           # reproduction: paper model on the dataset's own Whisper transcripts
asr = "column:whisper_text"
text = { equations = "paper-eq", sentences = "paper-sent" }
prompt = "paper"

[[systems]]
name = "paper@whisper-turbo"         # paper model on our Whisper transcripts (works on own recordings too)
asr = "whisper-turbo"
text = { equations = "paper-eq", sentences = "paper-sent" }
prompt = "paper"

[[systems]]
name = "qwen3-4b@whisper-turbo"      # open cascade, zero-shot
asr = "whisper-turbo"
text = "qwen3-4b"

[[systems]]
name = "qwen3-4b@oracle"             # upper bound for the text step: ground-truth pronunciation in
asr = "column:pronunciation"
text = "qwen3-4b"

[[systems]]
name = "qwen2-audio@e2e"             # open end-to-end audio LLM, zero-shot
e2e = "qwen2-audio"
max_tokens = 384

[[systems]]
name = "split@dataset-asr"           # split-then-convert on the dataset's transcripts (vs paper@dataset-asr)
asr = "column:whisper_text"
segmenter = "qwen3-4b"               # marks the maths spans; prose is kept verbatim from the transcript
text = { sentences = "paper-eq" }    # converts each span
prompt = "paper"

[[systems]]
name = "split@whisper-turbo"         # the same on our transcripts; `ldb dictate --task mixed` uses this
asr = "whisper-turbo"
segmenter = "qwen3-4b"
text = { sentences = "paper-eq" }
prompt = "paper"

# ---------------------------------------------------------------- M0 gates

[gates]
max_peak_memory_gb = 12
max_p95_latency_s = 3.0
min_nonempty_rate = 0.95
